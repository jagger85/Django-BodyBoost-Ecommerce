{% load static %}

<div class="bg-base-200 p-4" id="cart-totals" hx-swap-oob="true">
    <div class="space-y-4">
        <div class="flex justify-between text-gray-400">
            <span>Total price:</span>
            <span class="text-white">${{ total }}</span>
        </div>
        <div class="flex justify-between text-gray-400">
            <span>Tax:</span>
            <span class="text-white">${{ tax }}</span>
        </div>
        <div class="flex justify-between text-white pt-4 border-t border-gray-700">
            <span class="text-lg font-medium">Total:</span>
            <span class="text-lg font-medium">${{ grand_total }}</span>
        </div>
        <div class="pt-6">
            <a href="./place-order.html" class="btn bg-primary text-black w-full mb-3">Checkout</a>
            <a href="{% url 'store:store' %}" class="btn w-full">Continue Shopping</a>
        </div>
        <div class="pt-6 text-center">
            <img src="{% static '/images/misc/payments.png' %}"
                 alt="Payment methods"
                 class="h-8 inline-block opacity-75"
                 height="32"
                 width="auto">
        </div>
    </div>
</div>
