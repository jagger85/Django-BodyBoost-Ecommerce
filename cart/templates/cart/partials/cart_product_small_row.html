{% load static %}
{% load static %}
<div class="flex justify-between items-center px-4 py-6 text-gray-200">
    <div class="flex items-center">
        <div class="w-24 h-24 flex-shrink-0 overflow-hidden">
            <img src="{{ variant.product.product.images.url }}"
                 alt="{{ variant.product.product.name }}"
                 class="w-full h-full object-contain p-2"
                 width="96"
                 height="96">
        </div>
        <div class="ml-6">
            <a 
            class="hover:text-primary"
             href="{% url 'store:product_detail' variant.product.product.category.slug variant.product.product.slug variant.product.id %}">

             {{ variant.product.product.name }}
                <div class="text-sm text-gray-400">{{ variant.product.size }} - {{ variant.product.flavor }}</div>
            </a>
        </div>
    </div>
    <div id="product-price-{{ variant.product.id }}">
        <div class="text-xl font-medium">${{ variant.sub_total }}</div>
        <div class="text-sm text-gray-400">${{ variant.product.price }} each</div>
    </div>
</div>
