{% load cart_tags %}
<div id="product-controls"
     hx-target="#product-controls"
     hx-swap="outerHTML">
    {% is_in_cart product.id as in_cart %}
    {% cart_item_quantity product.id as quantity %}
    {% if in_cart %}
        <div class="flex items-center justify-start gap-2">
            <button class="btn btn-circle btn-sm btn-success"
                    hx-post="{{ request.path }}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-vals='{"action": "remove"}'>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-4 w-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4" />
                </svg>
            </button>
            <input type="text"
                   class="input input-bordered input-sm w-16 text-center bg-[#2A2C30] text-white"
                   value="{{ quantity }}"
                   readonly>
            <button class="btn btn-circle btn-sm btn-success"
                    hx-post="{{ request.path }}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-vals='{"action": "add"}'>
                <svg xmlns="http://www.w3.org/2000/svg"
                     class="h-4 w-4"
                     fill="none"
                     viewBox="0 0 24 24"
                     stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
                </svg>
            </button>
        </div>
    {% else %}
        <button class="btn btn-success btn-block gap-2"
                hx-post="{{ request.path }}"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-vals='{"action": "add"}'>
            <span class="text-xl">+</span>
            <span>Add to cart</span>
        </button>
    {% endif %}
</div>
