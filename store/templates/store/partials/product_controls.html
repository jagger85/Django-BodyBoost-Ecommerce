{% load cart_tags %}
<div id="product-controls"
     hx-target="#product-controls"
     hx-swap="outerHTML">
    {% is_in_cart product.id as in_cart %}
    {% cart_item_quantity product.id as quantity %}
    {% if in_cart %}
        <div class="col">
            <div class="input-group input-spinner">
                <div class="input-group-prepend">
                    <button class="btn btn-light"
                            type="button"
                            id="button-plus"
                            hx-post="{{ request.path }}"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                            hx-vals='{"action": "remove"}'>
                        <i class="fa fa-minus"></i>
                    </button>
                    </div>
                    <input type="text" class="form-control"  value="{{ quantity }}">
                    <div class="input-group-append">
                    <button class="btn btn-light"
                            type="button"
                            id="button-plus"
                            hx-post="{{ request.path }}"
                            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                            hx-vals='{"action": "add"}'>
                        <i class="fa fa-plus"></i>
                    </button>
                    </div>
                </div>
            </div>    
    {% else %}
        <button class="btn btn-primary"
                hx-post="{{ request.path }}"
                hx-vals='{"action": "add"}'>Add to Cart</button>
    {% endif %}
</div>
