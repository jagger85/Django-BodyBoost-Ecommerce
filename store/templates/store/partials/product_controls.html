{% load cart_tags %}
<div id="product-controls-{{ product.id }}"
     hx-target="#product-controls-{{ product.id }}"
     hx-swap="outerHTML">
    {% is_in_cart product.id as in_cart %}
    {% cart_item_quantity product.id as quantity %}
    {% if in_cart %}
        <div class="join">
            <button class="join-item btn btn-lg text-primary"
                    hx-post="{% url 'cart:cart_product' product.id %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-vals='{"action": "remove"}'>{% lucide 'minus' class="h-4 w-4" %}</button>
            <button class="join-item btn btn-lg text-center w-15">{{ quantity }}</button>
            <button class="join-item btn btn-lg text-primary"
                    hx-post="{% url 'cart:cart_product' product.id %}"
                    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                    hx-vals='{"action": "add"}'>{% lucide 'plus' class="h-4 w-4" %}</button>
        </div>
    {% else %}
        <button class="btn bg-primary btn-block gap-2 text-black min-w-40"
                hx-post="{% url 'cart:cart_product' product.id %}"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-vals='{"action": "add"}'>
            <span class="text-xl">+</span>
            <span>Add to cart</span>
        </button>
    {% endif %}
</div>
