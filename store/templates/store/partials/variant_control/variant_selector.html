<div class="flex flex-col gap-2">
    {% for v in product.variant.all %}
        <button hx-get="{% url 'store:product_detail_card' v.product.category.slug v.product.slug v.id %}" hx-target="#product-detail-card" hx-swap="outerHTML" class="btn bg-[#2A2D31]  w-full ring-lime-500/75 {% if v.id == variant.id %}ring-2{% endif %}">
            {{ v.size }} - {{ v.flavor }} (${{ v.price }})
        </button>
    {% endfor %}
</div>
