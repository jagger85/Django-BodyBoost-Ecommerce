services:
  - type: web
    plan: free
    name: bodyboost
    runtime: python
    buildCommand: './build.sh'
    startCommand: './start.sh'
    healthCheckPath: '/health/' 
    envVars:
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: WEB_CONCURRENCY
        value: 4
      - key: NODE_VERSION
        value: 18.x
      - key: NPM_VERSION
        value: 9.x
      - key: RESEND_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        value: bodyboost-db
      - key: DB_USERNAME
        value: postgres
      - key: DB_ENDPOINT
        sync: false
      - key: DB_PORT
        value: 5432
      - key: AWS_STORAGE_BUCKET_NAME
        value: bodyboost-static-media
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_FIRST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_LAST_NAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false