databases:
  - name: django-bodyboost-db
    plan: free
    databaseName: bb_db
    user: jagger85

services:
  - type: web
    plan: free
    name: bodyboost
    runtime: python
    buildCommand: './build.sh'
    startCommand: 'python -m gunicorn bodyboost.asgi:application -k uvicorn.workers.UvicornWorker' 
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: django-bodyboost-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4