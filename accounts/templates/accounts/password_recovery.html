{% extends 'base.html' %}
{% block content %}
    <div class="h-screen flex items-center justify-center bg-base-200">
        <div class="card w-full max-w-md bg-base-100 shadow-xl">
            <div class="card-body">
                <h1 class="text-4xl font-bold text-center mb-2">Forgot Your Password?</h1>
                <p class="text-center text-base-content/60 mb-8">Place your email for password recovery</p>
                <form hx-post="{% url 'auth:password_recovery' %}"
                      hx-swap="none">
                    {% csrf_token %}
                    <!-- Email Input -->
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text text-lg">Email</span>
                        </label>
                        <input type="email"
                               placeholder="your@email.com"
                               class="input input-bordered w-full"
                               name="email" />
                    </div>
                    <!-- Sign In Button -->
                    <button class="btn bg-primary w-full mt-6 text-lg text-black normal-case">Recover Account</button>
                    <!-- Sign Up Link -->
                    <div class="text-center mt-6 text-base-content/60">
                        Don't have an account?
                        <a href="{% url 'auth:register' %}"
                           class="text-primary hover:text-success-focus">Sign up</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
