{% extends 'frame.html' %}
{% load static %}
{% block content %}
    <div class="h-screen flex items-center justify-center bg-base-200">
        <div class="w-full h-full md:h-fit max-w-md bg-base-100 md:shadow-xl md:border-2 md:border-base-300">
            <div class="card-body">
                <a href="{% url 'home' %}" class="mb-6">
                    <img src="{% static 'images/logo.webp' %}" class="my-4" />
                </a>
                <h1 class="text-3xl font-bold text-center mb-2">Forgot Your Password?</h1>
                <p class="text-center text-base-content/60 mb-8">Place your email for password recovery</p>
                <form method="post"
                      action="{% url 'auth:password_recovery' %}"
                      hx-swap="none">
                    {% csrf_token %}
                    <!-- Email Input -->
                    <div class="form-control w-full flex flex-col gap-2">
                        <input type="email"
                               class="input input-bordered w-full"
                               name="email"
                               placeholder="your@email.com"
                               required />
                    </div>
                    <!-- Sign In Button -->
                    <button class="btn bg-primary w-full mt-6 text-lg text-black normal-case">Recover Account</button>
                    <!-- Sign Up Link -->
                    <div class="text-center mt-6 text-base-content/60">
                        Return to login page
                        <a href="{% url 'auth:login' %}"
                           class="text-primary hover:text-success-focus">Sign in</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
