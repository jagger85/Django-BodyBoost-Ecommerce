{% extends 'base.html' %}
{% block content %}
    <div class="h-screen flex items-center justify-center bg-base-200">
        <div class="card w-full max-w-md bg-base-100 shadow-xl">
            <div class="card-body">
                <h1 class="text-4xl font-bold text-center mb-2">Reset Password</h1>
                <p class="text-center text-base-content/60 mb-8">Place your new password</p>
                <form hx-post="{% url 'auth:password_reset' %}"
                      hx-swap="none"
                        class=" flex flex-col gap-4"                    
                      >
                    {% csrf_token %}
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text text-lg">Password</span>
                        </label>
                        <input type="password"
                               placeholder="your new password"
                               class="input input-bordered w-full"
                               name="password" />
                    </div>
                    <div class="form-control w-full">
                        <label class="label">
                            <span class="label-text text-lg">Confirm your password</span>
                        </label>
                        <input type="password"
                               placeholder="Confirm your new password"
                               class="input input-bordered w-full"
                               name="confirm_password" />
                    </div>
                    <!-- Reset Button -->
                    <button class="btn bg-primary w-full mt-6 text-lg text-black normal-case">Reset</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
