{% extends 'frame.html' %}
{% load static %}
{% block content %}
    <div class="h-screen flex items-center justify-center bg-base-200">
        <div class="w-full h-full max-w-md bg-base-100 md:h-fit md:shadow-xl md:rounded-[var(--radius-box)] md:border-2 md:border-base-300">
            <div class="card-body">
                <a href="{% url 'home' %}">
                    <img src="{% static 'images/logo.png' %}" class="my-4" />
                </a>
                <h1 class="text-4xl font-bold text-center mb-2">Reset Password</h1>
                <p class="text-center text-base-content/60 mb-8">Place your new password</p>
                <form method="post" class=" flex flex-col gap-4">
                    {% csrf_token %}
                    <div class="form-control w-full flex flex-col gap-2">
                        <label class="label">
                            <span class="label-text text-lg">Password</span>
                        </label>
                        <div class="input input-bordered w-full">{{ form.password }}</div>
                    </div>
                    <div class="form-control w-full flex flex-col gap-2">
                        <label class="label">
                            <span class="label-text text-lg">Confirm your password</span>
                        </label>
                        <div class="input input-bordered w-full">{{ form.confirm_password }}</div>
                    </div>
                    {% if form.non_field_errors %}
                        <div role="alert" class="alert alert-error alert-soft mt-4">
                            <svg xmlns="http://www.w3.org/2000/svg"
                                 class="h-6 w-6 shrink-0 stroke-current"
                                 fill="none"
                                 viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            <div class="flex flex-col">
                                <span>{{ form.non_field_errors }}</span>
                            </div>
                        </div>
                    {% endif %}
                    <!-- Reset Button -->
                    <button class="btn bg-primary w-full mt-6 text-lg text-black normal-case">Reset</button>
                </form>
            </div>
        </div>
    </div>
{% endblock %}
