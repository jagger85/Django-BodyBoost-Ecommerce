{% extends 'base.html' %}
{% load static %}
{% block content %}
    <!-- Banner Section -->
    <section class="container mx-auto px-4 pt-6">
        {% include 'includes/components/banner.html' %}
    </section>
    <!-- Popular Products Section -->
    <section class="container flex flex-col grow mx-auto px-4 py-16">
        <div>
            <header class="flex items-center justify-between mb-8">
                <h2 class="text-2xl font-bold text-white">Popular products</h2>
                <a href="{% url 'store:store' %}"
                   class="btn hover:text-primary">See all</a>
            </header>
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
                {% for variant in variants %}
                    {% include 'includes/components/product_card.html' with variant=variant %}
                {% endfor %}
            </div>
        </div>
    </section>
{% endblock content %}
