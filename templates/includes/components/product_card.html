{% load static %}
{% load static store_tags %}
<div class="outer-radius frame-padding bg-base-300">
<div class="bg-base-200 inner-radius p-4 flex flex-col relative">
    <!-- Product Image -->
    <a href="{% url 'store:product_detail' variant.product.category.slug variant.product.slug variant.id %}"
       class="block aspect-square rounded-lg overflow-hidden bg-base-200 mb-4">
        <img src="{{ variant.product.images.url }}"
             alt="{{ variant.product.name }}"
             class="w-full h-full object-contain p-4">
    </a>
    <!-- Product Info -->
    <div class="flex flex-col flex-grow">
        <!-- Product Name -->
        <h3 class="text-xl font-semibold text-white mb-1">
            <a href="{% url 'store:product_detail' variant.product.category.slug variant.product.slug variant.id %}">{{ variant.product.name }}</a>
        </h3>
        <!-- Brand Name -->
        <p class="text-gray-400 mb-2">{{ variant.product.brand }}</p>
        <!-- Rating -->
        <div class="flex items-center mb-2">
            <div class="flex text-yellow-400">
                {% for i in "12345" %}<i class="fas fa-star"></i>{% endfor %}
            </div>
            <span class="text-gray-400 ml-2">({{ variant.product.review_count|default:"124" }} reviews)</span>
        </div>
        <!-- Price -->
        <div class="text-2xl font-bold text-white mb-4">${{ variant.price }}</div>
        <!-- Add to Cart Button -->
        <div class="mt-auto">
            <div class="btn bg-primary w-full  text-black font-medium">
                <a href="{% url 'store:product_detail' variant.product.category.slug variant.product.slug variant.id %}">Add to cart</a>
            </div>
        </div>
    </div>
</div>
</div>
