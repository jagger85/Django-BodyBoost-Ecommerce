{% load static %}
<div class="bg-[#1E2023] rounded-xl p-4 flex flex-col relative">
    <!-- Best Seller Badge -->
    {% if product.is_best_seller %}
        <div class="absolute top-4 right-4 bg-primary text-black px-3 py-1 rounded-full text-sm font-medium">Best Seller</div>
    {% endif %}
    <!-- Product Image -->
    <a href="{% url 'store:product_detail' product.category.slug product.slug %}"
       class="block aspect-square rounded-lg overflow-hidden bg-[#2A2D31] mb-4">
        <img src="{{ product.images.url }}"
             alt="{{ product.product_name }}"
             class="w-full h-full object-contain p-4">
    </a>
    <!-- Product Info -->
    <div class="flex flex-col flex-grow">
        <!-- Product Name -->
        <h3 class="text-xl font-semibold text-white mb-1">
            <a href="{% url 'store:product_detail' product.category.slug product.slug %}">{{ product.product_name }}</a>
        </h3>
        <!-- Brand Name -->
        <p class="text-gray-400 mb-2">{{ product.brand }}</p>
        <!-- Rating -->
        <div class="flex items-center mb-2">
            <div class="flex text-yellow-400">
                {% for i in "12345" %}<i class="fas fa-star"></i>{% endfor %}
            </div>
            <span class="text-gray-400 ml-2">({{ product.review_count|default:"124" }} reviews)</span>
        </div>
        <!-- Price -->
        <div class="text-2xl font-bold text-white mb-4">${{ product.price }}</div>
        <!-- Add to Cart Button -->
        <button class="btn bg-primary w-full text-black font-medium">Add to cart</button>
    </div>
</div>
