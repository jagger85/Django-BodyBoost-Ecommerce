{% load static %}
<div class="relative w-full h-[280px] rounded-2xl overflow-hidden">
    <!-- Gradient Background -->
    <div class="absolute inset-0 bg-gradient-to-r from-[#FF69B4] via-[#9370DB] to-[#00CED1] opacity-90"></div>
    <!-- Decorative Blurred Circles -->
    <div class="absolute inset-0">
        <div class="absolute w-[500px] h-[500px] rounded-full bg-pink-500/30 blur-[100px] -left-24 -top-32"></div>
        <div class="absolute w-[500px] h-[500px] rounded-full bg-blue-500/30 blur-[100px] -right-24 -bottom-32"></div>
    </div>
    <!-- Content -->
    <div class="relative h-full flex flex-col items-center justify-center text-center z-10 px-4">
        <h1 class="text-5xl font-bold text-white mb-4 tracking-wide">GREAT BANNER</h1>
        <p class="text-xl text-white/90">demo banner</p>
    </div>
</div>
