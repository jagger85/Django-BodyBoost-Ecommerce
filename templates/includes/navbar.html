{% load static %}
{% load cart_tags %}
<header class="bg-base-200 shadow-lg border-b-1 border-base-100">
    <div class="navbar container mx-auto px-4 py-6">
        <!-- Logo -->
        <div class="navbar-start">
            <a href="{% url 'home' %}" class="flex items-center">
                <img class="h-8 w-auto"
                     src="{% static './images/logo.png' %}"
                     alt="Body Boost">
            </a>
        </div>

        <!-- Right Section -->
        <div class="navbar-end gap-4">
            <!-- Sign In -->
            {% if user.id is not None%}
            {{user.first_name}}
            <a href="{% url 'store:dashboard' %}" class="btn hover:text-primary">
                {% lucide 'user' %}
            </a>
            {% else %}
            
            <a href="{% url 'auth:login'%}" class="btn bg-primary text-black">Sign In</a>
            {% endif%}
            <!-- Cart -->
            <a href="{% url 'store:cart' %}" class="btn gap-2 hover:text-primary">
                {% lucide 'shopping-cart' %}
                <span id="cart-quantity"
                      hx-get="{% url 'cart:cart_quantity' %}"
                      hx-trigger="cartUpdate from:body">{{ cart_total_items }}</span>
            </a>
        </div>
    </div>
</header>
