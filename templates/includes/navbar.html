{% load static %}
<header class="bg-[#1a1c1f] shadow-lg">
    <div class="navbar container mx-auto px-4">
        <!-- Logo -->
        <div class="navbar-start">
            <a href="{% url 'home' %}" class="flex items-center">
                <img class="h-8 w-auto"
                     src="{% static './images/logo.png' %}"
                     alt="Body Boost">
            </a>
        </div>
        <!-- Search Bar -->
        <div class="navbar-center flex-1 max-w-2xl mx-4">
            <div class="relative w-full">
                <input type="search"
                       class="w-[100] h-12 bg-[#2a2d31] border-none text-white placeholder:text-gray-400 pl-5 pr-12 focus:outline-none focus:ring-2 focus:ring-success"
                       placeholder="Search products..." />
                <button class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-400 hover:text-white">
                    <i class="fas fa-search text-lg"></i>
                </button>
            </div>
        </div>
        <!-- Right Section -->
        <div class="navbar-end gap-4">
            <!-- Category Dropdown -->
            <details class="dropdown">
                <summary class="btn bg-[#2a2d31] hover:bg-[#3a3d41] border-none text-white">All Categories</summary>
                <div class="dropdown-content menu bg-base-200 rounded-box z-50 w-52 shadow-xl mt-2">
                    <ul class="p-2">
                        {% for category in all_categories %}
                            <li>
                                <a href="{% url 'store:product_by_category' category.slug %}"
                                   class="text-base-content hover:text-primary">{{ category.category_name }}</a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </details>
            <!-- Sign In -->
            <a href="#" class="btn btn-ghost text-white hover:text-primary">Sign In</a>
            <!-- Cart -->
            <a href="{% url 'cart:cart' %}" class="btn btn-success gap-2">
                <i class="fas fa-shopping-cart"></i>
                Cart (0)
            </a>
        </div>
    </div>
</header>
