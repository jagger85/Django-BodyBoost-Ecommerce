{% load static %}
{% load cart_tags %}
<header class="bg-base-200 shadow-lg border-b-1 border-base-100">
    <div class="navbar container mx-auto px-4 py-6">
        <!-- Logo -->
        <div class="navbar-start">
            <a href="{% url 'home' %}" class="flex items-center">
                <img class="h-8 w-auto"
                     src="{% static './images/logo.png' %}"
                     alt="Body Boost">
            </a>
        </div>
        <!-- Search Bar -->
        <div class="navbar-center flex-1 max-w-2xl mx-4"></div>
        <!-- Right Section -->
        <div class="navbar-end gap-4">
            <!-- Category Dropdown -->
            <details class="dropdown">
                <summary class="btn bg-base-200 hover:text-primary border-none text-white">All Categories</summary>
                <div class="dropdown-content menu bg-base-200 rounded-box z-50 w-52 shadow-xl mt-2">
                    <ul class="p-2">
                        {% for category in all_categories %}
                            <li>
                                <a href="{% url 'store:product_by_category' category.slug %}"
                                   class="text-base-content hover:text-primary">{{ category.category_name }}</a>
                            </li>
                        {% endfor %}
                    </ul>
                </div>
            </details>
            <!-- Sign In -->
            <a href="#" class="btn bg-primary text-black">Sign In</a>
            <!-- Cart -->
            <a href="{% url 'cart:cart' %}" class="btn gap-2 hover:text-primary">
                {% lucide 'shopping-cart' %}
                <span id="cart-quantity"
                      hx-get="{% url 'cart:cart_quantity' %}"
                      hx-trigger="cartUpdate from:body">{{ cart_quantity }}</span>
            </a>
        </div>
    </div>
</header>
