<div class="card-body bg-base-100 rounded-[var(--radius-box)] custom-top-border">
  <div class="flex items-center justify-between border-b border-base-300 pb-4 mb-6">
    <div class="text-lg font-bold">Add address</div>
  </div>
  <form action="{% url 'dashboard:add_address' %}"
        method="post"
        class="flex flex-col gap-4">
    {% csrf_token %}
    <div class="flex flex-col items-start gap-2">
      <label class="label font-stretch-expanded">Name</label>
      <div class="input w-full">{{ form.name }}</div>
    </div>
    <div class="flex flex-col items-start gap-2">
      <label class="label font-stretch-expanded">Street</label>
      <div class="input w-full">{{ form.street }}</div>
    </div>
    <div class="flex flex-col items-start gap-2">
      <label class="label font-stretch-expanded">Post Code</label>
      <div class="input w-full">{{ form.post_code }}</div>
    </div>
    <div class="flex flex-col md:flex-row gap-4">
      <div class="flex flex-col items-start gap-2 w-full md:w-1/3">
        <label class="label font-stretch-expanded">City</label>
        <div class="input w-full">{{ form.city }}</div>
      </div>
      <div class="flex flex-col items-start gap-2 w-full md:w-1/3">
        <label class="label font-stretch-expanded">Province</label>
        <div class="input w-full">{{ form.province }}</div>
      </div>
      <div class="flex flex-col items-start gap-2 w-full md:w-1/3">
        <label class="label font-stretch-expanded">Country</label>
        <div class="input w-full">{{ form.country }}</div>
      </div>
    </div>
    <div class="flex flex-col items-start gap-2">
      <label class="label font-stretch-expanded">Order Note</label>
      <div class="input w-full">{{ form.order_note }}</div>
    </div>
    <button type="submit" class="btn bg-primary text-black w-fit">
      {% lucide 'plus' size=20 %}
      Add
    </button>
  </form>
</div>
